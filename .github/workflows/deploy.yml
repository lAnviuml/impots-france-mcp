name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cible Cloudflare
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Wasm
        run: npm run build:wasm

      - name: Deploy Worker
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_HOSTNAME: ${{ secrets.MCP_HOSTNAME }}
        shell: bash
        run: |
          test -n "$MCP_HOSTNAME"
          npx wrangler deploy --env "${{ inputs.environment }}" \
            --domain "$MCP_HOSTNAME" \
            --var "ALLOWED_HOSTNAMES:$MCP_HOSTNAME"

      - name: Configure Access verification secrets
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        shell: bash
        run: |
          printf '%s' "$ACCESS_TEAM_DOMAIN" | npx wrangler secret put ACCESS_TEAM_DOMAIN --env "${{ inputs.environment }}"
          printf '%s' "$ACCESS_AUD" | npx wrangler secret put ACCESS_AUD --env "${{ inputs.environment }}"
