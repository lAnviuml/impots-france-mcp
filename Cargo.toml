[workspace]
members = ["crates/fiscal-core", "crates/fiscal-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Impôts France MCP contributors"]
license = "MIT"
repository = "https://github.com/murillo-consulting/impots-france-mcp"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
